; mega_fw — thin Arduino Mega 2560 executor firmware (Idea 12 / PROMPT_ROBOT §3).
; Build recipe identical to rcj_arduino_src/AGENTS.md:
;   ~/.platformio/penv/Scripts/platformio.exe run --project-dir <this dir>
; Success = the [SUCCESS] line + RAM/Flash report, exit code 0.
; Compile-only verification: the firmware cannot run on the host; never claim a
; hardware/runtime test after only compiling.
[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050
    arduino-libraries/Servo
